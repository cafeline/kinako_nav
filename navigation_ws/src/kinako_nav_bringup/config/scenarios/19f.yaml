/**:
  ros__parameters:
    use_sim_time: true

emcl2:
  ros__parameters:
    map_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    pointcloud_topic: "/pointcloud/cut"
    map_hdf5_path: ""
    transform_tolerance: 0.2
    odom_straight_only: true
    odom_freq: 10
    num_particles: 1000
    initial_pose_x: 32.43
    initial_pose_y: 39.85
    initial_pose_yaw: 1.82
    initial_std_xy: 0.5
    initial_std_yaw: 0.5
    sensor_offset_x: 0.0
    sensor_offset_y: 0.0
    sensor_offset_z: 0.0
    sensor_roll: 0.0
    sensor_pitch: 0.0
    sensor_yaw: 0.0
    odom_fw_dev_per_fw: 0.19
    odom_fw_dev_per_rot: 0.0001
    odom_rot_dev_per_fw: 0.13
    odom_rot_dev_per_rot: 0.2
    external_yaw_child_frame: "imu_heading"
    external_yaw_timeout: 1.0

imu_rpy_pose:
  ros__parameters:
    imu_topic: "livox/imu"
    bias_sample_count: 1000
    clip_enable: true
    clip_max_rad_per_s: 10.0
    lpf_enable: true
    lpf_alpha: 0.2
    dt_check_enable: true
    dt_min: 0.003
    dt_max: 0.006
    marker_frame: "livox_frame"
    marker_topic: "imu_arrow"
    publish_yaw_tf: true
    yaw_tf_parent_frame: "odom"
    yaw_tf_child_frame: "imu_heading"

pointcloud2_cutter:
  ros__parameters:
    input_pointcloud_topic: "/livox/lidar"
    filtered_pointcloud_topic: "pointcloud/cut"
    output_filtered_pointcloud_topic: "pointcloud/cut"
    pose_topic: "/mcl_pose"
    scan_frame_id: "lidar_link"
    output_frame_id: "lidar_link"
    publish_scan: true
    output_scan_topic: "scan"
    scan_height_min: -0.15
    scan_height_max: 0.5
    scan_angle_min: -2.0
    # scan_angle_min: -3.141592653589793
    scan_angle_max: 2.0
    # scan_angle_max: 3.141592653589793
    scan_angle_increment: 0.005
    scan_range_min: 0.05
    scan_range_max: 10.0
    default_laser_height_min: 0.0
    default_laser_height_max: 2.0
    max_filtered_points: 3000
    regions_config_path: ""

obstacle_tracker:
  ros__parameters:
    scan_topic: "/scan"
    dynamic_topic: "/dynamic_obstacles"
    static_topic: "/static_obstacles"
    debug_dynamic_topic: "/dynamic_obstacles_debug"
    debug_static_topic: "/static_obstacles_debug"
    target_frame: "map"
    tf_timeout_sec: 0.05
    processing_range: 10.0
    range_jump_ratio: 0.1
    range_jump_min: 0.05
    min_cluster_points: 3
    range_gap_abs: 0.3

tvvf_vo_c_node:
  ros__parameters:
    vector_field_path_width: 4.0 # パス幅 [m]
    max_linear_velocity: 0.5  # 最大並進速度[m/s]
    max_angular_velocity: 0.4  # 最大角速度[rad/s]
    robot_radius: 0.24  # ロボット半径[m]
    base_frame: "base_link"  # ロボットベースフレーム名
    global_frame: "map"  # グローバル座標系
    goal_tolerance: 0.5  # 目標位置許容誤差[m]

velocity_smoother:
  ros__parameters:
    time_constant: 0.2
    command_timeout: 0.5
    max_linear_speed: 0.5
    max_angular_speed: 0.4
    publish_frequency: 30.0
    base_frame: "base_link"
    raw_cmd_topic: "cmd_vel_raw"
    filtered_cmd_topic: "cmd_vel"
    marker_topic: "cmd_vel_marker"
    marker_scale_y: 0.5
    marker_scale_z: 0.8
    marker_color: [0.0, 0.8, 1.0, 0.9]

waypoint_follower_node:
  ros__parameters:
    waypoint_csv_path: ""
    position_tolerance: 4.5
    orientation_tolerance: 3.14
    max_retry_count: 3  # 1ウェイポイントにつき再挑戦する最大回数
    goal_timeout: 30.0  # 各ウェイポイントで待機する最大時間[s]
    auto_start: true  # ノード起動直後に自動で巡航を開始するフラグ
    enable_skip_on_timeout: true  # タイムアウト発生時に該当ウェイポイントをスキップするか
    loop_navigation: false  # 最終ウェイポイント到達後に再び先頭へ戻るか
    global_frame: "map"  # ウェイポイントを表現するグローバルTFフレーム
    robot_base_frame: "base_link"  # ロボットベースのTFフレーム名
    use_sim_time: true  # シミュレーション時間を使用するかどうか

map_server:
  ros__parameters:
    map_yaml_path: ""

vq_server:
  ros__parameters:
    frame_id: "map"
    marker_topic: "compressed_map_markers"
    marker_color_rgba: [0.1, 0.8, 0.4, 0.30]
    map_file: ""
